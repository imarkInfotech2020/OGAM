# Scope for SonarCloud AUTOMATIC ANALYSIS.
#
# sonar-project.properties beside this file declares the same scope and is IGNORED in this mode - provable
# rather than assumed: on PR #625 SonarCloud reported issues in scripts/ and .github/workflows/ci.yml, neither
# of which is inside its sonar.sources (src, android/app/src/main, ios). Automatic Analysis reads
# .sonarcloud.properties; a CI-based scan reads sonar-project.properties, and this repo runs the former (no
# scan step, no token - see the note in .github/workflows/ci.yml).
#
# What that cost: the quality gate wants rating A on new code, and of the 97 issues on that PR exactly ONE was
# in product source (BlobServer.kt:98, a MINOR about ignoring File.delete()'s return). New-code reliability was
# E because of a BLOCKER in scripts/blob-e2e/desktop-side.mjs - a `for(;;)` poller whose exits are
# process.exit() plus a 120s deadline, which the rule cannot see - and security was D because of a /tmp path in
# scripts/ios/launch-wda.mjs. A check that fails on developer tooling is a check people learn to ignore.
#
# Shipped source only: scripts and the test trees are OUT of the analysis, not merely reclassified as tests.
# They are developer tooling and harnesses, held to this repo's own lint, type and coverage gates - a
# product-quality rating on them is what made this check unreadable. pro/ is a separate private repo Automatic
# Analysis never clones.
sonar.sources=src,android/app/src/main,ios
sonar.exclusions=**/node_modules/**,**/Pods/**,**/build/**,**/coverage/**,ios/build/**,android/build/**,website/**,scripts/**,pro/**,__tests__/**,android/app/src/test/**,ios/OffgridMobileTests/**,**/*.test.ts,**/*.test.tsx
